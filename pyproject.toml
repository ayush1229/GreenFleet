[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "greenfleet"
version = "0.1.0"
description = "Auditable synthetic fleet planning research prototype"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "pandas==3.0.6", "scikit-learn==1.9.1", "scipy==1.17.1", "pymoo==0.6.2", "streamlit==1.64.0", "plotly==7.1.0", "pyarrow==25.0.1", "pyyaml==6.0.3", "psutil==7.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
greenfleet = "greenfleet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
